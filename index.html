
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EsToDoList</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen text-blue-950 bg-gradient-to-br from-sky-100 via-blue-200 to-sky-400">

  <!-- CABEÇALHO -->
  <header class="bg-white/30 backdrop-blur-xl border border-white/50 rounded-3xl shadow-xl mx-3 mt-3">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between gap-4">

      <h1 class="text-xl md:text-3xl font-bold">
        ☑️ EsToDoList
      </h1>

      <span class="hidden md:inline text-sm text-blue-800">
        Organize sua rotina escolar
      </span>

    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

      <!-- COLUNA ESQUERDA -->
      <section class="min-w-0 bg-white/30 backdrop-blur-xl border border-white/60 rounded-3xl shadow-xl p-5 space-y-5 lg:sticky top-5 self-start">

        <h2 class="font-semibold text-blue-900">
          ⊕ Nova tarefa
        </h2>

        <!-- FORMULÁRIO -->
        <form class="flex flex-col gap-3">

          <input
            type="text"
            placeholder="O que você precisa fazer?"
            class="w-full min-w-0 bg-white/40 border border-white/50 text-blue-950 placeholder-blue-400 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 hover:bg-white/60 transition"
          >

          <input
            type="date"
            class="w-full min-w-0 bg-white/40 border border-white/50 text-blue-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 hover:bg-white/60 transition"
          >

          <button
            type="button"
            class="w-full bg-gradient-to-r from-sky-400 to-blue-500 text-white rounded-full px-4 py-3 font-semibold shadow-lg hover:from-sky-500 hover:to-blue-600 transition"
          >
            ＋ Adicionar
          </button>

        </form>

        <!-- PESQUISA -->
        <input
          type="search"
          placeholder="Pesquisar tarefa..."
          class="w-full min-w-0 bg-white/40 border border-white/50 text-blue-950 placeholder-blue-400 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 hover:bg-white/60 transition"
        >

        <!-- FILTROS -->
        <div class="space-y-3">

          <p class="text-sm text-blue-800">Filtros</p>

          <div class="flex flex-wrap gap-2">

            <button
              type="button"
              class="px-4 py-2 rounded-full bg-blue-500 text-white shadow-md hover:bg-blue-600 transition"
            >
              Todas
            </button>

            <button
              type="button"
              class="px-4 py-2 rounded-full bg-white/40 text-blue-800 hover:bg-white/70 transition"
            >
              Pendentes
            </button>

            <button
              type="button"
              class="px-4 py-2 rounded-full bg-white/40 text-blue-800 hover:bg-white/70 transition"
            >
              Concluídas
            </button>

          </div>
        </div>

        <!-- PROGRESSO -->
        <div class="bg-white/30 border border-white/40 rounded-2xl p-5">
          <p class="text-sm text-blue-800">Progresso do dia</p>
          <p class="text-2xl font-bold mt-2">0%</p>
          <p class="text-xs text-blue-500 mt-1">
            0 de 0 tarefas concluídas
          </p>
        </div>

      </section>

      <!-- LISTA DE TAREFAS -->
      <section class="min-w-0 lg:col-span-2 bg-white/30 backdrop-blur-xl border border-white/60 rounded-3xl shadow-xl p-6 min-h-[600px]">

        <div class="mb-7">
          <h2 class="text-3xl font-semibold">
            Minhas tarefas
          </h2>

          <p class="text-sm text-blue-700 mt-1">
            Um passo de cada vez.
          </p>
        </div>

        <ul class="space-y-3">

          <!-- TAREFA 1 -->
          <li class="min-w-0 bg-white/40 border border-white/60 rounded-2xl shadow-sm p-5 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">

            <label class="flex items-start gap-4 min-w-0">

              <input
                type="checkbox"
                class="mt-1 w-5 h-5 shrink-0 accent-blue-500"
              >

              <span class="min-w-0 break-words">

                <span class="block font-semibold">
                  Trabalho de História
                </span>

                <span class="text-sm text-blue-600">
                  ▦ 20/10/2026
                </span>

              </span>

            </label>

            <div class="flex gap-2 md:shrink-0">

              <button
                type="button"
                class="px-4 py-3 rounded-xl bg-blue-100/60 text-blue-600 hover:bg-blue-200 transition"
              >
                Editar
              </button>

              <button
                type="button"
                class="px-4 py-3 rounded-xl bg-red-50/60 text-red-500 hover:bg-red-100 transition"
              >
                Excluir
              </button>

            </div>

          </li>

        </ul>

        <p class="mt-6 text-sm text-blue-600">
          ● 1 tarefa pendente
        </p>

      </section>

    </div>
  </main>

</body>
</html>
